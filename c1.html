<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMA | Justas del sabber</title><link href="favicon.ico" rel="icon"><style>

}.big{padding:15px 22px;font-size:18px}.star{font-size:28px}.hint{color:var(--muted);font-size:14px}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}.list{display:none;background:#fff;border-radius:20px;padding:12px;margin-top:12px}.list.show{display:block}.item{padding:13px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item b{display:block;margin-bottom:5px}.item.learnedItem{background:#eefbf4}.item .status{display:inline-block;margin-top:7px;font-weight:800;color:#147a4c}.item.pendingItem .status{color:#b26a00}.footer{text-align:center;color:var(--muted);padding:18px;font-size:13px}@keyframes pop{from{transform:scale(.98);opacity:.3}to{transform:scale(1);opacity:1}}@media(max-width:520px){.app{padding:10px}.hero,.card{border-radius:20px}.nav .btn{flex:1}.tools .btn{flex:1}}
.practiceBox{display:none;margin-top:18px}.practiceBox.show{display:block}.choices{display:grid;gap:12px;margin-top:14px}.choice{width:100%;text-align:left;border:2px solid var(--line);border-radius:16px;padding:15px;background:#fff;font-weight:750;cursor:pointer}.choice:hover{border-color:var(--pri)}.choice.correct{background:#eafaf2;border-color:#72d4a5}.choice.wrong{background:#fff0f0;border-color:#ef9a9a}.feedback{min-height:30px;margin-top:12px;font-size:19px;font-weight:850}.scorebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.pill{background:#fff;border-radius:999px;padding:8px 12px;color:var(--ink);font-weight:850}.achievements{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.award{background:#fff7d6;color:#765900;border-radius:12px;padding:8px 10px;font-weight:800}.modeToggle{background:#fff;border-radius:16px;padding:6px;display:inline-flex;gap:6px}.modeToggle .btn{box-shadow:none;padding:9px 13px}.modeToggle .btn.active{background:var(--pri);color:#fff}@media(max-width:520px){.choice{font-size:16px;padding:14px}.scorebar{justify-content:center}}
</style></head><body><main class="app"><section class="hero"><h1>🌟 Aprendo Jugando</h1><p>Cuestionario interactivo de Primer Grado. Lee, practica, gana estrellas y aprende jugando.</p><div class="scorebar"><span class="pill" id="player">👧 Mia ⭐ <b id="score">0</b></span><span class="pill">🔥 Racha <b id="streak">0</b></span></div><div class="achievements" id="achievements"></div></section><div class="tabs"><button class="btn active" id="socialBtn">🏠 Vida Social y Trabajo</button><button class="btn" id="naturalBtn">🌱 Medio Natural y Salud</button><button class="btn" id="pendingBtn">📖 Falta aprender <span id="pendingCount"></span></button></div><div class="progressWrap"><div class="meta"><span id="counter">Pregunta 1 de 40</span><span id="stars">⭐ 0 aprendidas</span></div><div class="progress"><div class="bar" id="bar"></div></div></div><div class="modeToggle"><button class="btn active" id="studyMode">📖 Aprender</button><button class="btn" id="practiceMode">🎮 Practicar</button></div><section class="card"><span class="badge" id="subject"></span><div class="q" id="question"></div><div class="center"><button class="btn primary big" id="reveal">👀 Ver respuesta</button></div><div class="answer" id="answer"></div><div class="practiceBox" id="practiceBox"><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></div><div class="tools"><button class="btn" id="speakQ">🔊 Leer pregunta</button><button class="btn" id="speakAll">🔊 Leer pregunta y respuesta</button><button class="btn good" id="speak" disabled>🔊 Escuchar respuesta</button><button class="btn" id="practice">🟡 Estoy practicando</button><button class="btn" id="learned" disabled>⭐ Ya la aprendí</button><button class="btn" id="random">🎲 Pregunta al azar</button></div></section><div class="nav"><button class="btn" id="prev">← Anterior</button><button class="btn primary" id="next">Siguiente →</button></div><div class="tools"><input class="search" id="search" placeholder="🔎 Buscar una pregunta…"><button class="btn" id="showAll">📚 Ver todas</button><button class="btn" id="reset">↻ Reiniciar progreso</button></div><section class="list" id="list"></section><div class="footer">Diseñado para estudiar de forma simple, visual y divertida.</div></main><script>
const data={social:[
["¿Qué es el reloj?","El reloj es un instrumento que sirve para medir el tiempo."],["¿Cómo se llama la manecilla más corta del reloj?","La manecilla más corta del reloj se llama horario y marca la hora."],["¿Cómo se llama la manecilla más larga del reloj?","La manecilla más larga del reloj se llama minutero e indica los minutos que pasan."],["¿Cuántas horas tiene el día?","El día tiene 24 horas."],["¿Cuántos días tiene una semana?","Una semana tiene 7 días."],["¿Cuántos meses tiene un año?","Un año tiene 365 días y 12 meses."],["¿Qué es la familia?","La familia es el primer grupo social. Puede estar formada por los padres, hermanos, abuelos, tíos o primos."],["¿En qué fecha y año se fundó la ciudad de San Lorenzo?","La ciudad de San Lorenzo fue fundada el 10 de agosto del año 1775."],["¿Quién fundó la ciudad de San Lorenzo?","La ciudad de San Lorenzo fue fundada por el gobernador Agustín Fernando de Pinedo."],["¿En qué fecha y año se fundó la ciudad de Asunción?","La ciudad de Asunción se fundó el 15 de agosto del año 1537."],["¿Quién fundó la ciudad de Asunción?","La ciudad de Asunción fue fundada por el capitán Juan de Salazar y Espinoza."],["¿Cuántas banderas tuvo el Paraguay?","El Paraguay tuvo 4 banderas."],["¿Cuáles fueron los países que pelearon en la Guerra del Chaco?","Los países que pelearon en la Guerra del Chaco fueron Paraguay y Bolivia."],["¿Cuántos años duró la Guerra del Chaco?","La Guerra del Chaco duró 3 años."],["¿En qué fecha se firmó el protocolo de paz?","El protocolo de paz se firmó el 12 de junio del año 1935."],["¿Cuáles son las necesidades del hogar?","Todas las familias tienen necesidades básicas como alimento, vivienda, educación, ropa, salud y otras más."],["¿Cuáles son los derechos del niño/a?","Los derechos del niño/a son: tener una familia, una nacionalidad y un nombre; derecho a la alimentación y derecho a una vivienda."],["¿Qué son los Símbolos Nacionales?","Los Símbolos Nacionales son los emblemas que representan a un país y su historia."],["¿Cuáles son los Símbolos Nacionales?","La Constitución Nacional del año 1992, en su artículo 139, establece que nuestros símbolos nacionales son: el Pabellón de la República, el Himno Nacional y los Escudos."],["¿Qué son los instrumentos de orientación?","Los instrumentos de orientación son herramientas que nos ayudan a saber dónde estamos y a encontrar nuestro camino."],["¿Cuáles son los instrumentos de orientación?","Algunos instrumentos de orientación son: mapa, brújula, GPS, veleta y radar, entre otros."],["¿Cuáles son las emociones que podemos expresar?","Podemos expresar alegría, enojo, susto, tristeza, sorpresa, miedo y asco."],["¿Qué es la autoestima?","La autoestima es cuánto nos valoramos a nosotros mismos."],["¿Cuáles son los valores que debemos practicar en el seno familiar?","Amor, respeto, responsabilidad, solidaridad, comprensión, diálogo y obediencia, entre otros."],["¿Cuáles son los deberes de la casa?","Respetar a los miembros de la familia, honrar a la familia y la nación, valorar los alimentos y colaborar con los quehaceres del hogar."],["¿Qué es la participación democrática en la familia?","Es que todos tenemos la oportunidad de hablar y compartir nuestras ideas."],["¿Cuáles son los roles que realizan los adultos?","Los adultos son quienes proveen el alimento, trabajan, velan por nuestra salud y enseñan las normas de comportamiento."],["¿Cuáles son los tipos de familia?","Los tipos de familia son: familia nuclear y familia extensa."],["¿Qué es ahorrar?","Ahorrar es guardar dinero para utilizarlo cuando haya una necesidad urgente."],["¿Cuáles son las dependencias de la escuela?","Dirección, aula, secretaría, biblioteca, cantina, baño, patio y sala de informática."],["¿Quiénes son los miembros de la familia escolar?","Estudiantes, maestros, director, secretaria, coordinadora, bibliotecaria, padres, portero, cantinero y limpiadora."],["¿Cuáles son los derechos en la escuela?","Derecho a la igualdad, a la recreación, a la educación y a la libre expresión."],["¿Cuáles son los deberes en la escuela?","Respetar y obedecer a los maestros, respetar las normas, mantener limpio el entorno, realizar las tareas y asistir a clases."],["¿Qué es la participación democrática en la escuela?","Significa que todos los niños tienen oportunidad de decidir y trabajar juntos."],["¿Qué tenemos que tener en cuenta para realizar las tareas?","Tener una sala iluminada, limpia y ordenada; contar con útiles escolares; evitar distractores y usar sillas y mesas acordes a nuestra estatura."],["¿Cuáles son los momentos del día?","Los momentos del día son: mañana, tarde y noche."],["¿Cuáles son los meses del año?","Enero, Febrero, Marzo, Abril, Mayo, Junio, Julio, Agosto, Setiembre, Octubre, Noviembre y Diciembre."],["¿Cuáles son los días de la semana?","Domingo, Lunes, Martes, Miércoles, Jueves, Viernes y Sábado."],["¿Cuántos días asistimos en la escuela?","Asistimos en la escuela 5 días."],["¿Cuáles son las estaciones del año?","Otoño, Invierno, Primavera y Verano."]],natural:[
["¿Qué es la materia?","La materia es todo aquello que forma parte del universo. Puede presentarse en diferentes tamaños, colores y formas."],["¿Cuáles son las clases de materia?","Las clases de materia son materia orgánica y materia inorgánica."],["¿Qué es la mezcla?","Una mezcla es la combinación de dos o más sustancias. Por ejemplo, al preparar un caldo de verduras se mezclan distintos ingredientes."],["¿Cuáles son las clases de mezclas?","Las clases de mezclas son mezcla homogénea y mezcla heterogénea."],["¿Qué es la energía?","La energía es lo que nos permite hacer muchas actividades. Para que funcionen los aparatos usamos energía eléctrica."],["¿Cuáles son los tipos de energía?","Los tipos de energía son: energía eólica, energía solar y energía hidroeléctrica."],["¿Qué son los animales vivíparos?","Son animales que crecen dentro del cuerpo de su madre y nacen ya formados, como perros, gatos y seres humanos."],["¿Qué son los animales ovíparos?","Los animales que nacen de huevos se llaman ovíparos."],["¿Qué son las plantas?","Las plantas son seres vivos que pueden crecer en el suelo, en el agua o sobre otras plantas."],["¿Cuáles son las partes del cuerpo humano?","Cabeza, tronco, extremidades superiores y extremidades inferiores."],["¿Qué son los ecosistemas?","Son conjuntos de seres vivos —plantas, animales y microorganismos— y elementos no vivos como agua, aire y luz solar."],["¿Cuáles son los movimientos de la Tierra?","Movimiento de traslación y movimiento de rotación."],["¿Qué son los recursos naturales?","Son aquellos que provienen de la naturaleza y que los seres humanos utilizan para crear objetos y dar soluciones a sus necesidades."],["¿Cuándo sucede la contaminación ambiental?","Sucede cuando las personas ensucian el aire, el agua o el suelo."],["¿Cuáles son los tipos de contaminación?","Contaminación del aire, contaminación del agua y contaminación del suelo."],["¿Qué es el agua potable?","Es el agua que podemos beber sin que nos haga daño. Es limpia, transparente y no tiene mal olor ni sabor raro."],["¿Qué es la higiene personal?","Es el conjunto de prácticas que realizamos todos los días para mantener nuestro cuerpo limpio y saludable."],["¿Qué es la postura correcta?","Es la forma en que debemos colocar nuestro cuerpo cuando estamos sentados, parados o en movimiento."],["¿Cuáles son los tipos de suelo?","Suelo arcilloso, suelo húmico y suelo arenoso."],["¿Qué es el sol?","El sol es una estrella muy grande y está formada de gases muy calientes."],["¿Cuáles son las consecuencias del humo del tabaco?","Afecta la salud: puede producir dificultad para respirar, tos constante y enfermedades del corazón y los pulmones. También contamina el aire y deja basura en las calles."],["¿Cuáles son las coberturas de los animales?","Pelos, plumas, piel desnuda, escamas y caparazón."],["¿Cuántas patas pueden tener los animales?","Los animales pueden tener dos, cuatro, seis, ocho o más patas."],["¿Cómo se pueden desplazar los animales?","Pueden desplazarse nadando, volando, caminando, saltando o reptando."],["¿Cuáles son las partes de la planta?","Hoja, flor, fruto, tallo y raíz."],["¿Cuáles son los tipos de ecosistemas?","Acuáticos, terrestres, mixtos y urbanos."],["¿Adónde se desarrollan los ecosistemas acuáticos?","Los ecosistemas acuáticos se desarrollan en el agua."],["¿Adónde se desarrollan los ecosistemas terrestres?","Los ecosistemas terrestres se desarrollan en la tierra."],["¿Adónde se desarrollan los ecosistemas mixtos?","Los ecosistemas mixtos tienen partes tanto en agua como en la tierra."],["¿Adónde se desarrollan los ecosistemas urbanos?","Los ecosistemas urbanos poseen elementos artificiales creados por los seres humanos."],["¿Qué es un recurso natural?","Un recurso natural es un elemento que hace posible la vida."],["¿Qué son las basuras?","Las basuras son los desechos que ya no necesitamos."],["¿Cuáles son los tipos de basuras?","Orgánica, inorgánica, peligrosos y reciclables."],["¿Cuáles son las materias orgánicas?","Las materias orgánicas son los seres vivos."],["¿Cuáles son las materias inorgánicas?","El agua, las rocas y el aire."],["¿De dónde viene la energía eólica?","La energía eólica viene del viento."],["¿Cómo se produce la energía hidroeléctrica?","La energía hidroeléctrica se produce con el movimiento del agua."],["¿De dónde proviene la energía solar?","La energía solar proviene del sol."],["¿Cómo cuidamos la energía eléctrica?","Cuidamos la energía eléctrica apagando los aparatos que no usamos."],["¿Por qué es importante el Sol?","El Sol es importante porque nos da luz, calor y energía, entre otros beneficios."] ]};
let mode='social',i=0,view='study',learningMode='study';let learned=JSON.parse(localStorage.getItem('aprendo1')||'{}');let practicing=JSON.parse(localStorage.getItem('practicando1')||'{}');let stats=JSON.parse(localStorage.getItem('aprendoStats2')||'{}');let score=+(localStorage.getItem('aprendoScore2')||0),streak=+(localStorage.getItem('aprendoStreak2')||0);let attempts=0;const $=id=>document.getElementById(id);function key(){return mode+'-'+i}function currentArr(){return data[mode]}function key(n=i,m=mode){return m+'-'+n}function pendingEntries(){let out=[];for(const m of ['social','natural'])data[m].forEach((x,n)=>{if(!learned[key(n,m)])out.push({m,n,x})});return out}function render(){if(view==='pending'){renderPending();return}const a=currentArr();$('subject').textContent=mode==='social'?'🏠 Vida Social y Trabajo':'🌱 Medio Natural y Salud';$('question').textContent=(i+1)+'. '+a[i][0];$('answer').innerHTML='<strong>✅ Respuesta correcta:</strong><br>'+a[i][1];$('answer').classList.remove('show');$('reveal').style.display=learningMode==='practice'?'none':'inline-block';$('speak').disabled=learningMode==='practice';$('learned').disabled=learningMode==='practice';$('practiceBox').classList.toggle('show',learningMode==='practice');$('feedback').textContent='';attempts=0;if(learningMode==='practice') buildChoices();$('practice').textContent=practicing[key()]?'🟡 Practicando · Quitar':'🟡 Estoy practicando';$('learned').textContent=learned[key()]?'✅ Aprendida · Quitar marca':'⭐ Marcar como aprendida';$('counter').textContent=`Pregunta ${i+1} de ${a.length}`;$('bar').style.width=((i+1)/a.length*100)+'%';$('prev').disabled=i===0;$('next').disabled=i===a.length-1;updateStars();renderList()}function updateStars(){let n=Object.keys(learned).filter(k=>k.startsWith(mode+'-')&&learned[k]).length;let total=data[mode].length;let pr=Object.keys(practicing).filter(k=>k.startsWith(mode+'-')&&practicing[k]&&!learned[k]).length;$('stars').textContent=`⭐ ${n} aprendidas · 🟡 ${pr} practicando · 📖 ${total-n-pr} por aprender`;$('pendingCount').textContent='('+pendingEntries().length+')'}function setMode(m){view='study';mode=m;i=0;$('socialBtn').classList.toggle('active',m==='social');$('naturalBtn').classList.toggle('active',m==='natural');$('pendingBtn').classList.remove('active');$('list').classList.remove('show');render()}function setPending(){view='pending';$('socialBtn').classList.remove('active');$('naturalBtn').classList.remove('active');$('pendingBtn').classList.add('active');renderPending()}function renderPending(){let p=pendingEntries();$('subject').textContent='📖 Falta aprender';$('question').textContent=p.length?`Todavía faltan ${p.length} preguntas por aprender.`:'🎉 ¡Felicitaciones! Ya aprendiste todas las preguntas.';$('answer').classList.remove('show');$('reveal').style.display='none';$('speak').disabled=true;$('learned').disabled=true;$('counter').textContent=`${80-p.length} de 80 aprendidas`;$('stars').textContent=`⭐ ${80-p.length} aprendidas · 📖 ${p.length} faltan`;$('pendingCount').textContent='('+p.length+')';$('bar').style.width=((80-p.length)/80*100)+'%';$('prev').disabled=true;$('next').disabled=true;$('list').classList.add('show');$('list').innerHTML=p.length?p.map(o=>`<div class="item pendingItem" data-m="${o.m}" data-n="${o.n}"><b>${o.m==='social'?'🏠':'🌱'} ${o.n+1}. ${o.x[0]}</b><span>${o.x[1]}</span><span class="status">📖 Falta aprender</span></div>`).join(''):'<div class="item learnedItem center"><b>🌟 ¡Todo aprendido!</b><span>Excelente trabajo. Puedes reiniciar el progreso para volver a practicar.</span></div>';document.querySelectorAll('.item[data-n]').forEach(el=>el.onclick=()=>{mode=el.dataset.m;i=+el.dataset.n;view='study';$('pendingBtn').classList.remove('active');$('socialBtn').classList.toggle('active',mode==='social');$('naturalBtn').classList.toggle('active',mode==='natural');$('list').classList.remove('show');render();scrollTo({top:0,behavior:'smooth'})})}
function saveSmart(){localStorage.setItem('aprendoStats2',JSON.stringify(stats));localStorage.setItem('aprendoScore2',score);localStorage.setItem('aprendoStreak2',streak);localStorage.setItem('aprendo1',JSON.stringify(learned));localStorage.setItem('practicando1',JSON.stringify(practicing));updateSmartUI()}
function updateSmartUI(){if($('score'))$('score').textContent=score;if($('streak'))$('streak').textContent=streak;let totalLearned=Object.values(learned).filter(Boolean).length, nat=Object.keys(learned).filter(k=>k.startsWith('natural-')&&learned[k]).length;let a=[];if(totalLearned>=10)a.push('🏆 Aprendiste 10 preguntas');if(streak>=5)a.push('🔥 5 correctas seguidas');if(nat>=data.natural.length)a.push('🌱 Experta en Medio Natural');$('achievements').innerHTML=a.map(x=>'<span class="award">'+x+'</span>').join('')}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function buildChoices(){let arr=data[mode],correct=arr[i][1],pool=arr.map(x=>x[1]).filter(x=>x!==correct);let opts=shuffle([correct,...shuffle(pool).slice(0,2)]);$('choices').innerHTML=opts.map((x,n)=>`<button class="choice" data-c="${x===correct?'1':'0'}">${x}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(b))}
function answerChoice(btn){if(btn.disabled)return;attempts++;let k=key(),st=stats[k]||{correct:0,wrong:0};if(btn.dataset.c==='1'){btn.classList.add('correct');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);st.correct++;streak++;let gain=attempts===1?2:1;if(st.correct>=3&&attempts===1)gain=3;score+=gain;$('feedback').textContent=`✅ ¡Muy bien! +${gain} ⭐`;practicing[k]=true;if(st.correct>=3){learned[k]=true;practicing[k]=false;$('feedback').textContent+=' · 🟢 ¡Pregunta aprendida!'}stats[k]=st;saveSmart();updateStars()}else{btn.classList.add('wrong');btn.disabled=true;st.wrong++;streak=0;learned[k]=false;practicing[k]=true;stats[k]=st;saveSmart();$('feedback').textContent=attempts>=2?'❌ La respuesta correcta es: '+data[mode][i][1]:'❌ Intenta otra vez';if(attempts>=2){$('answer').classList.add('show');$('speak').disabled=false}updateStars()}}
function setLearningMode(m){learningMode=m;$('studyMode').classList.toggle('active',m==='study');$('practiceMode').classList.toggle('active',m==='practice');render()}
$('studyMode').onclick=()=>setLearningMode('study');$('practiceMode').onclick=()=>setLearningMode('practice');
$('speakAll').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[mode][i][0]+'. '+data[mode][i][1]);u.lang='es-PY';u.rate=.82;speechSynthesis.speak(u)};
$('socialBtn').onclick=()=>setMode('social');$('naturalBtn').onclick=()=>setMode('natural');$('pendingBtn').onclick=setPending;$('reveal').onclick=()=>{$('answer').classList.add('show');$('reveal').style.display='none';$('speak').disabled=false;$('learned').disabled=false};$('speakQ').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[mode][i][0]);u.lang='es-PY';u.rate=.82;speechSynthesis.speak(u)};$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[mode][i][1]);u.lang='es-PY';u.rate=.85;speechSynthesis.speak(u)};$('practice').onclick=()=>{let k=key();practicing[k]=!practicing[k];if(practicing[k])learned[k]=false;localStorage.setItem('practicando1',JSON.stringify(practicing));localStorage.setItem('aprendo1',JSON.stringify(learned));render()};$('learned').onclick=()=>{let k=key();learned[k]=!learned[k];if(learned[k])practicing[k]=false;localStorage.setItem('aprendo1',JSON.stringify(learned));localStorage.setItem('practicando1',JSON.stringify(practicing));render()};$('prev').onclick=()=>{if(view==='study'&&i>0){i--;render();scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=()=>{if(view==='study'&&i<data[mode].length-1){i++;render();scrollTo({top:0,behavior:'smooth'})}};$('random').onclick=()=>{view='study';i=Math.floor(Math.random()*data[mode].length);render()};$('reset').onclick=()=>{if(confirm('¿Borrar todas las preguntas marcadas como aprendidas?')){learned={};practicing={};localStorage.removeItem('aprendo1');localStorage.removeItem('practicando1');stats={};score=0;streak=0;localStorage.removeItem('aprendoStats2');localStorage.removeItem('aprendoScore2');localStorage.removeItem('aprendoStreak2');updateSmartUI();render()}};$('showAll').onclick=()=>{if(view==='pending')return;$('list').classList.toggle('show');$('showAll').textContent=$('list').classList.contains('show')?'🙈 Ocultar lista':'📚 Ver todas'};$('search').oninput=()=>{if(view==='pending')setMode(mode);renderList()};function renderList(){if(view==='pending')return;let q=$('search').value.toLowerCase().trim();let arr=data[mode].map((x,n)=>({x,n})).filter(o=>!q||(o.x[0]+' '+o.x[1]).toLowerCase().includes(q));$('list').innerHTML=arr.map(o=>`<div class="item ${learned[key(o.n)]?'learnedItem':'pendingItem'}" data-n="${o.n}"><b>${o.n+1}. ${o.x[0]}</b><span>${o.x[1]}</span><span class="status">${learned[key(o.n)]?'✅ Aprendida':'📖 Falta aprender'}</span></div>`).join('');if(q)$('list').classList.add('show');document.querySelectorAll('.item[data-n]').forEach(el=>el.onclick=()=>{i=+el.dataset.n;$('list').classList.remove('show');$('search').value='';render();scrollTo({top:0,behavior:'smooth'})})}updateSmartUI();render();
</script></body></html>
