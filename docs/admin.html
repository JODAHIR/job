<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar conocimientos · Asistente operativo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b3fbe'/%3E%3Ctext x='7' y='23' fill='white' font-size='24'%3Ea%3C/text%3E%3C/svg%3E"></head><body class="admin"><main><header><div><a href="./index.html">← Volver al chatbot</a><h1>Base de conocimientos</h1></div><div><button id="login">Ingresar con Google</button><button id="logout" hidden>Salir</button></div></header><p id="status" role="status">Cargando conexión…</p><div id="workspace" hidden><div class="admin-tools"><button id="new">Nuevo procedimiento</button></div><div class="admin-grid"><section><h2>Procedimientos</h2><p>Se muestran hasta 100 registros.</p><div id="list"></div></section><section><h2 id="edit-title">Nuevo procedimiento</h2><form id="editor"><label>Título<input id="title" maxlength="200" required></label><label>Preguntas habituales y palabras clave<textarea id="questions" maxlength="3000" placeholder="Ej.: ¿Cómo doy de alta un cliente? Alta, cuentas, ABM…"></textarea></label><label>Sistema o soporte<input id="support" maxlength="500"></label><label>Pasos operativos<textarea id="steps" maxlength="10000" rows="6" required></textarea></label><label>Horarios<input id="hours" maxlength="500"></label><label>Plantilla en caso correcto<textarea id="good" maxlength="3000"></textarea></label><label>Plantilla en caso incorrecto<textarea id="bad" maxlength="3000"></textarea></label><label class="check"><input id="published" type="checkbox"> Publicar para que el chatbot lo consulte</label><button id="save" type="submit">Guardar procedimiento</button></form></section></div></div></main><script src="admin-bundle.js" defer></script></body></html>
