<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivo y escaneo de remisiones</title><style>body{font:15px Arial;background:#f3f7f8;color:#213c43;margin:0}main{max-width:1080px;margin:45px auto;padding:24px}section,dialog{background:white;border:1px solid #d8e4e8;border-radius:14px;padding:28px}dialog{width:min(560px,85vw);max-height:85vh;overflow:auto}dialog::backdrop{background:#12343c88}button,input,select{font:inherit;border:1px solid #cedadd;border-radius:7px;padding:10px}button{cursor:pointer;background:#edf0f2;color:#213c43}button.primary{background:#d9f4e4;color:#12643b}button[aria-pressed="true"]{background:#fff1ba;border-color:#e2cb76}button:disabled{opacity:.45;cursor:default}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin:24px 0}label{display:grid;gap:8px;margin:12px 0}.custody-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label:has([name=confirmed]){display:flex;grid-column:1/-1;align-items:center}details{border-top:1px solid #d8e4e8;padding:14px 0}small{color:#627b83}table{width:100%;margin-top:20px;border-collapse:collapse}td,th{text-align:left;padding:15px 8px;border-bottom:1px solid #e2eaed}.badge{background:#d9f4e4;padding:8px;border-radius:20px}footer{margin-top:30px;text-align:right;color:#627b83}[role=alert]{color:#b51b30}@media(max-width:650px){.custody-fields{grid-template-columns:1fr}td,th{padding:10px 3px}td button{margin:4px 0}main{padding:12px}}</style><main><h1>Remisiones · Archivo y escaneo</h1><p>DEMOSTRACIÓN · Datos ficticios. Los cambios se reinician al recargar.</p><label>Rol de prueba<select id="role"><option value="technical">Administrador</option><option value="director">Director</option><option value="responsible">Responsable designado</option><option value="other">Usuario sin designación</option></select></label><section><h2>Remisiones</h2><table><thead><tr><th>CAC</th><th>Expediente</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr><td>0201 · CHORÉ</td><td>2026-DEMO-001</td><td><span class="badge">Conciliada</span></td><td><button data-custody="archive" data-remision="demo">Archivo</button></td></tr></tbody></table></section><footer>DPO/UNIDAD DE OPERACIONES</footer></main><dialog id="modal"></dialog><script type="module">
import {bindRemisionCustody} from '../docs/dpo/cdq-v3/src/remision-custody-ui.js';
import {custodyPayload,canManageCustody,archiveMetadata} from '../docs/dpo/cdq-v3/src/remision-custody-domain.js';
const db={remisiones:[{id:'demo',expediente:'2026-DEMO-001',cacId:'0201',receivedOn:'2026-10-26',year:2026,month:10,revision:1}],cacs:[{id:'0201',gerenciaId:'norte'}],gerencias:[{id:'norte',name:'Gerencia Norte',responsables:[{correo:'responsable@example.test'}]}]},events=[];
const cloud={profile:{active:true,role:'technical'},auth:{currentUser:{uid:'demo-user',email:'admin@example.test',emailVerified:true}},async call(name,input){if(name==='readRemisionCustody')return [...events].reverse();if(!canManageCustody(this.profile,this.auth.currentUser,db.gerencias[0],db.remisiones[0]))throw Error('Sin permiso');events.push({...custodyPayload(input.kind==='archive'?{kind:'archive',...archiveMetadata(db.remisiones[0],db.gerencias[0],input.number)}:input),owner:document.querySelector('#role').selectedOptions[0].textContent+' de prueba',at:{seconds:Date.now()/1000}});}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#role').onchange=e=>{cloud.profile.role=['technical','director'].includes(e.target.value)?e.target.value:'asistente';cloud.auth.currentUser.email=e.target.value==='responsible'?'responsable@example.test':'otro@example.test';};bindRemisionCustody({db,cloud,esc});
</script></html>
